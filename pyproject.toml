[project]
name = "gamebot"
version = "0.1.0"
description = "Windows 游戏自动化脚本框架"
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "pyautogui",
    "mss",
    "pywin32",
    "numpy",
    "pyperclip",
    "pywinauto",
    "winsdk",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
pyauto = [
    "pyautogui",
    "mss",
]
win32 = [
    "pywin32",
    "pywinauto",
    "winsdk",
]
opencv = [
    "opencv-python",
    "numpy",
]
playwright = [
    "playwright",
]
all = [
    "pyautogui",
    "mss",
    "pywin32",
    "opencv-python",
    "numpy",
    "pyperclip",
    "pywinauto",
    "winsdk",
    "playwright",
]

[project.scripts]
gamebot = "gamebot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
